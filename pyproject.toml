[project]
name = "etl_emendas_parlamentares"
version = "0.0.1"
authors = [{ name = "gbarbos4@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "db-dtypes>=1.2.0",
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-storage>=3.17.0",
    "numpy>=2.0.0",
    "pandas>=2.3.3",
    "plotly>=5.22.0",
    "polars>=2.0.0",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.36.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.uv]
link-mode = "copy"
